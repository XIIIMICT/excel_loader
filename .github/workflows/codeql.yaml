name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    # Ночные сканы идут по default-ветке и подхватывают новые security-запросы.
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Free CodeQL code scanning requires a public repository. Query the GitHub API
  # instead of trusting event payloads, so every trigger type (push, PR, manual,
  # schedule) gets the same answer. A failed query fails the workflow rather than
  # silently skipping analysis.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - name: Check repository visibility
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          visibility="$(gh api "repos/$REPOSITORY" --jq .visibility)"
          echo "Repository visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CodeQL is skipped: free code scanning needs a public repository."
          fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Оба языка извлекаются без сборки и сервисов.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

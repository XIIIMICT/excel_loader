name: Compile Python
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ["main", "dev", "ci"]
    paths:
      - ".github/workflows/compile-python.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - "src/**"
  pull_request:
    branches: ["main", "dev", "ci"]
    paths:
      - ".github/workflows/compile-python.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - "src/**"

jobs:
  compileall:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --no-dev

      - name: Compile backend sources
        run: uv run --no-dev -m compileall src

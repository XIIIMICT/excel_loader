name: Docker CI
permissions:
  contents: read
  pull-requests: read
  packages: write

on:
  push:
    branches: ["main", "dev", "ci"]
    paths:
      - ".github/workflows/docker-image.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - ".dockerignore"
      - "Dockerfile"
      - "src/**"
  pull_request:
    branches: ["main", "dev", "ci"]
    paths:
      - ".github/workflows/docker-image.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - ".dockerignore"
      - "Dockerfile"
      - "src/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Set lower case owner name
        run: echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for excel_loader
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/excel_loader
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha

      - name: Build excel_loader
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=release-excel-loader
          cache-to: type=gha,mode=max,scope=release-excel-loader
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


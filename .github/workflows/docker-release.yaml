name: Docker Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  release:
    name: Publish tested image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-image
      - run: docker load -i production-image.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed CI
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          owner="${REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/excel_loader"
          for tag in "${VERSION#v}" "$COMMIT"; do
            docker tag excel-loader:ci "$image:$tag"
            docker push "$image:$tag"
          done

name: Ruff and ty Checks
permissions:
  contents: read
  pull-requests: read

on:
  push:
    paths:
      - ".github/workflows/linters.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/linters.yaml"
      - ".gitignore"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"

jobs:
  ruff-and-ty-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ty check
        run: uv run ty check

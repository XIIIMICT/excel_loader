name: excel_loader

include:
  - path: ./infra/compose.db.yaml
  - path: ./infra/compose.monitoring.yaml

services:
  loader:
    container_name: el-loader
    # Хостовые UID/GID ради bind-папок ./logs и ./unloaded_data: на Linux
    # без этого лог-файлы принадлежали бы псевдо-пользователю образа
    # (appuser, uid 100) и ломали права доступа. HOST_UID/HOST_GID задаются
    # в .env (`id -u` / `id -g`); в Docker Desktop не действует.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Хост PostgreSQL переопределяется переменной POSTGRES_HOST.
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./data:/app/data:ro
      - ./mock_data/pd:/app/mock_data/pd:ro
      - ./logs:/app/logs
      - ./unloaded_data:/app/unloaded_data
    networks: [net]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      # Пакетный запуск не имеет /metrics: состояние запуска уходит в Pushgateway.
      # Пусто по умолчанию: push метрик включается, когда METRICS_PUSHGATEWAY_URL задана в .env.
      METRICS_PUSHGATEWAY_URL: ${METRICS_PUSHGATEWAY_URL:-}

networks:
  net:
    name: el-net

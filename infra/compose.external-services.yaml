services:
  postgres:
    container_name: el-postgres
    image: postgres:18-alpine
    profiles: [standalone]
    restart: unless-stopped
    environment:
      # Compose читает эти значения из .env; настройки приложения остаются в config.toml.
      POSTGRES_USER: ${POSTGRES_USER:?Нужно указать POSTGRES_USER в окружении или .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Нужно указать POSTGRES_PASSWORD в окружении или .env}
      POSTGRES_DB: ${POSTGRES_DB:?Нужно указать POSTGRES_DB в окружении или .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [net]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    container_name: el-loki
    image: grafana/loki:3.7
    profiles: [standalone]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [net]
    ports: ["3100:3100"]

  grafana:
    container_name: el-grafana
    image: grafana/grafana:13.1-slim
    profiles: [standalone]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Нужно указать GF_SECURITY_ADMIN_USER в окружении или .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Нужно указать GF_SECURITY_ADMIN_PASSWORD в окружении или .env}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks: [net]
    ports: ["3000:3000"]

volumes:
  postgres-data:
    name: el-postgres-data
  loki-data:
    name: el-loki-data
  grafana-data:
    name: el-grafana-data

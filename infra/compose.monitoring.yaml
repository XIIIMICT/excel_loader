# Наблюдательный стек excel_loader (единый стандарт compose-файлов):
#   логи    — Alloy (stateless, без профиля) → Loki → Grafana;
#   метрики — Pushgateway → Prometheus → Alertmanager (loader — пакетный CLI,
#             /metrics нет, состояние запуска пушится в Pushgateway;
#             см. src/metrics.py и METRICS_PUSHGATEWAY_URL в .env).
#
# Все сервисы без профиля: alloy всегда (`just monitoring`), loki/grafana/
# pushgateway/prometheus/alertmanager — по запросу (`just monitoring-stand`).
# На сервере бэкенды заменяются центральным стеком DWH
# infra/compose.monitoring.yaml, а Alloy остаётся здесь и пушит в
# внешний LOKI_URL / METRICS_PUSHGATEWAY_URL.

services:
  alloy:
    container_name: el-alloy
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
    environment:
      LOKI_URL: ${LOKI_URL:?Нужно указать LOKI_URL в окружении или .env}
      # Лейбл env на всех логах (sys.env("LOG_ENV") в config.alloy): local для
      # локальных/standalone запусков, prod — на сервере.
      LOG_ENV: ${LOG_ENV:-local}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/excel_loader:ro
    networks: [net]
    ports: ["12345:12345"]

  loki:
    container_name: el-loki
    image: grafana/loki:3.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [net]
    ports: ["3100:3100"]

  grafana:
    container_name: el-grafana
    image: grafana/grafana:13.1-slim
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Нужно указать GF_SECURITY_ADMIN_USER в окружении или .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Нужно указать GF_SECURITY_ADMIN_PASSWORD в окружении или .env}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks: [net]
    ports: ["3000:3000"]

  pushgateway:
    container_name: el-pushgateway
    image: prom/pushgateway:v1.11.1
    restart: unless-stopped
    volumes:
      - pushgateway-data:/data
    networks: [net]
    ports: ["9091:9091"]

  prometheus:
    container_name: el-prometheus
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks: [net]
    ports: ["9090:9090"]

  alertmanager:
    container_name: el-alertmanager
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      SUPPORT_MAIL: ${SUPPORT_MAIL:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    # entrypoint.sh рендерит конфиг в /tmp (rw-слой контейнера), поэтому
    # /etc/alertmanager остаётся read-only.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    networks: [net]
    ports: ["9093:9093"]

volumes:
  loki-data:
    name: el-loki-data
  grafana-data:
    name: el-grafana-data
  pushgateway-data:
    name: el-pushgateway-data
  prometheus-data:
    name: el-prometheus-data
  alertmanager-data:
    name: el-alertmanager-data

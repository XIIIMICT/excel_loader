auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # Retention was never set, which in Loki means "keep forever" (~175 MB/day of
  # application logs accumulate on the volume). 7 days matches what the
  # dashboards ask for (compare today against last week) and is what the
  # rotated file logs can no longer hold.
  # Env-configurable default shared by all projects and the central DWH stack.
  retention_period: ${LOKI_RETENTION:-168h}

compactor:
  # The compactor is what actually ENFORCES `retention_period`; without it the
  # setting is inert and chunks are never deleted.
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m

analytics:
  reporting_enabled: false

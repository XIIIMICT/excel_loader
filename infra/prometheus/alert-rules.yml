# Алерты Excel Loader. Правила НЕ вимают POSTGRES/ведомственные —
# только состояния запусков loader и живость наблюдательного стека.
#
# Loader — пакетный CLI: эл_loader_run_status остаётся последним значением
# между запусками, а el_loader_run_last_success_seconds обновляется только
# успешным запуском — по нему ловим «запуски не происходят вообще».
#
# Расписание запусков в месте эксплуатации знаете вы: порог 26 h ниже
# рассчитан на ежедневный запуск — при другой частоте поднимите его.

groups:
  - name: excel_loader_runs
    rules:
      - alert: ExcelLoaderRunFailed
        expr: el_loader_run_status >= 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Excel Loader: последний запуск с ошибками"
          description: "`el_loader_run_status` = {{ $value }} (0 success, 1 partial_success, 2 failure)."
      - alert: ExcelLoaderLastRunTooOld
        expr: time() - el_loader_run_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: запуски более 26 часов назад не было"
          description: "Порог 26 h рассчитан на ежедневный запуск; скорректируйте при другой частоте."
      - alert: ExcelLoaderNoSuccessfulRun
        expr: time() - el_loader_run_last_success_seconds > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Excel Loader: более 26 часов без полностью успешного запуска"
          description: "`el_loader_run_last_success_seconds` не обновился — все последние запуски с ошибками или не запусками."
      - alert: ExcelLoaderStageP95Slow
        # Pushgateway keeps the last run's buckets; this is a slow *last run*,
        # not a rolling baseline. Threshold assumes the usual daily batch.
        expr: histogram_quantile(0.95, sum by (le, module, stage) (el_loader_stage_duration_seconds_bucket)) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: стадия загрузки дольше 60 с (p95)"
          description: "`el_loader_stage_duration_seconds` p95 > 60 s у {{ $labels.module }}/{{ $labels.stage }} в последнем запуске. Порог поднимите, если регламентный прогон занимает больше минуты."
  - name: excel_loader_monitoring_stack
    # Unique project prefix: these rule files are also copied into the central
    # DWH rules directory, where generic names would collide across projects.
    rules:
      - alert: ExcelLoaderPushgatewayDown
        expr: up{job="pushgateway"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: Pushgateway недоступен"
          description: "Loader пушит метрики в Pushgateway; без него о состоянии запусков не видно. Дашборд «Excel Loader — Состояние загрузок», Prometheus → /alerts."
      - alert: ExcelLoaderPrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: Prometheus не скрапит себя"
          description: "Санити-серия up — проверка живости коллектора. Дашборд «Excel Loader — Состояние загрузок», Prometheus → /alerts."
      - alert: ExcelLoaderLokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: Loki недоступен"
          description: "Alloy некуда слать логи; приложение при этом продолжает работать. Смотрите дашборд «Excel Loader — Состояние загрузок» и Grafana → Explore."
      - alert: ExcelLoaderAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: Alertmanager недоступен"
          description: "Письма алертов не уйдут; сами алерты видны в Prometheus → /alerts."
      - alert: ExcelLoaderGrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excel Loader: Grafana недоступна"
          description: "Дашборд «Excel Loader — Состояние загрузок» недоступен; логи по-прежнему идут в Loki."

# Prometheus: Pushgateway (состояния пакетных запусков), сам Prometheus и
# живость остального observability-стека (Loki/Alertmanager/Grafana).
# Конфиг НЕ расширяет ${VAR} из compose — имена сервисов фиксируются здесь;
# ретенция задаётся флагом контейнера из PROMETHEUS_RETENTION.
#
# Loader пушит в Pushgateway только при запуске (пакетный CLI): значения серии
# сохраняются между запусками, поэтому прометеевский scrape забирает их каждые 15 s.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pushgateway
    # `honor_labels`: серии от loader уже содержат job=excel_loader и instance,
    # попытка Prometheus перезаписать их перепутала бы статистику.
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

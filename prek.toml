#:schema https://www.schemastore.org/prek.json

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
files = '\\.py$'
# Только захваченные файлы: форматирование всего дерева переписывает то, что
# редактирует другой агент, и превращает чужой коммит в мерж-конфликт.
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
files = '\\.py$'

[[repos.hooks]]
id = "ty-check"
name = "ty check"
# `ty` — проектно-широкая проверка: импорты резолвятся по всему пакету,
# сузить её до файла нельзя. prek при таком запуске застэшивает рабочее
# дерево и ломает параллельных агентов, поэтому хук стал opt-in.
# Он всё ещё обязателен в CI (`just typecheck`: ruff/format/ty, затем тесты).
entry = "uv run ty check"
language = "system"
stages = ["manual"]
pass_filenames = false

[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
pass_filenames = false
files = '^pyproject\.toml$'

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-yaml"
files = '.ya?ml$'

[[repos.hooks]]
id = "end-of-file-fixer"
types = ["text"]

[[repos.hooks]]
id = "trailing-whitespace"
types = ["text"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]
types = ["text"]

[[repos.hooks]]
id = "fix-byte-order-marker"
types = ["text"]

#:schema https://www.schemastore.org/prek.json

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
files = '\\.py$'
# Только захваченные файлы: форматирование всего дерева переписывает то, что
# редактирует другой агент, и превращает чужой коммит в мерж-конфликт.
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
files = '\\.py$'
require_serial = true

[[repos.hooks]]
id = "ty-check"
name = "ty check"
# Shared hook policy (maintainer decision, 2026-11-25): every checker runs on
# the staged files at commit time and on the whole tree in CI. `ty` still
# resolves imports across the project, but the diagnostics are limited to the
# files being committed, so a parallel agent's work is never rewritten.
entry = "uv run ty check"
language = "system"
files = '\.py$'
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
pass_filenames = false
files = '^pyproject\.toml$'

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-yaml"
files = '.ya?ml$'

[[repos.hooks]]
id = "end-of-file-fixer"
types = ["text"]

[[repos.hooks]]
id = "trailing-whitespace"
types = ["text"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]
types = ["text"]

[[repos.hooks]]
id = "fix-byte-order-marker"
types = ["text"]
